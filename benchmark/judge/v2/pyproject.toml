[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robolab-v2"
version = "0.1.0.dev0"
description = "Self-contained RoboLab V2 generator, boolean judge core, and competition scoring adapters."
requires-python = ">=3.9"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.0"]
usd = ["usd-core>=24.5", "scipy>=1.11"]

